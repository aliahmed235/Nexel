spring:
  application:
    name: Vercel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vercel_clone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  data:
    redis:
      # Railway's Redis service provides this as a redis:// URL.
      # Lettuce connects lazily, so the app still starts if Redis is down.
      url: ${REDIS_URL:redis://localhost:6379}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that it matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # Behind Nginx: trust X-Forwarded-* so redirect URLs use https and the real host.
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  frontend-callback-path: /auth/callback
  cors-allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiry: 7d
    issuer: vercel-clone
  crypto:
    secret: ${CRYPTO_SECRET}
  oauth-state:
    cookie-name: oauth_state
    ttl: 10m
    cookie-secure: ${OAUTH_STATE_COOKIE_SECURE:false}
  auth-code:
    # Overridable without a rebuild, e.g. APP_AUTH_CODE_TTL=10m
    ttl: ${APP_AUTH_CODE_TTL:5m}
  worker:
    # Set false on a pure-API instance once the worker runs elsewhere.
    enabled: ${WORKER_ENABLED:true}
  storage:
    # "local" (disk / Railway volume) or "r2" (Cloudflare object storage).
    type: ${STORAGE_TYPE:local}
    # Base dir for the local backend.
    path: ${STORAGE_PATH:/data/deployments}

r2:
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:nexel-sites}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    scope: read:user user:email repo

logging:
  level:
    com.aliahmed.Vercel: DEBUG
